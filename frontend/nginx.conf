# nginx config for the frontend image only (it serves the built Vite bundle and
# nothing else — the API/WebSocket proxying lives in the separate `proxy`
# service, see ../nginx/default.conf).
#
# The one thing this adds over stock nginx:alpine is the history-API fallback.
# The app uses client-side routing (react-router-dom: /login, /positions,
# /symbols/:symbol), so a hard refresh or a pasted deep link asks nginx for a
# path that has no file behind it. Without `try_files ... /index.html` those
# requests 404 and only `/` works.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed Vite build output (app.<hash>.js) is content-addressed, so it can be
  # cached indefinitely. Deliberately NOT falling back to index.html here: a
  # missing asset should be a visible 404, not an HTML page served as JS.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must never be cached, or a browser keeps requesting the previous
  # deploy's hashed assets after an update.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
