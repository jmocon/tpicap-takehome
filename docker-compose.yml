services:
  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_FILE: /app/data/trades.db
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - trades-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_WS_URL: ws://localhost:8080/ws
    depends_on:
      - backend

  # Single entry point: proxies /trades, /health and /ws to backend, everything
  # else to frontend. Only this service publishes a host port — backend and
  # frontend are reachable only inside the compose network.
  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  trades-data:
