# Single entry point for the whole app: routes API + WebSocket traffic to the
# backend by path, everything else to the frontend's own nginx. This is what
# lets the frontend and backend share one origin (no CORS needed browser-side
# for this path) and gives reviewers one URL instead of two.
#
# The API lives under a single reserved `/api/` prefix rather than one location
# per resource. That's structural, not cosmetic: the frontend is a SPA with
# client-side routes at the root (`/`, `/login`, `/positions`, `/symbols/...`),
# so any per-resource API location here is one name collision away from making
# a page unreachable — `/positions` was exactly that, an API route and a page
# route claiming the same URL. With `/api/` reserved, the SPA owns the entire
# root namespace and new backend routes can never shadow a page.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;

  # WebSocket upgrade — must come before the generic "/" location and matches
  # the dedicated WS_PATH the backend listens on (see backend/src/realtime/ws-server.ts).
  # Deliberately NOT under /api/: the WS server matches this exact pathname, so
  # the URI must reach the backend unrewritten. No collision risk — the SPA has
  # no /ws route.
  location /ws {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Everything the backend serves, under one prefix. The trailing slash on
  # proxy_pass is load-bearing: it strips the matched `/api/` prefix, so
  # /api/trades reaches the backend as /trades and Express keeps mounting its
  # routes at /trades, /positions, /auth, /health unchanged (see
  # backend/src/app.ts). Removing that slash would forward /api/trades verbatim
  # and every API call would 404.
  location /api/ {
    proxy_pass http://backend:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
  }
}
